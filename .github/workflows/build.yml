name: Run tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs pnpm (from packageManager) and Node.js (from .node-version),
      # then runs a frozen install.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Install playwright browsers
        run: pnpm playwright install --with-deps chromium
      - name: Run tests
        run: pnpm run ci
