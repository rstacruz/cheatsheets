name: Run tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version from packageManager, Node.js from .node-version
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Install playwright browsers
        run: pnpm playwright install --with-deps chromium
      - name: Run tests
        run: pnpm run ci
