<h3 id="nock">Nock</h3>

<pre><code class="language-js">scope = nock('http://foo.com')
scope = nock('http://foo.com', { allowUnmocked: true })
</code></pre>

<pre><code class="language-js">nock('http://foo.com')
  .get('/user')
  .reply(200, { id: 1234 })
</code></pre>

<h3 id="filtering">Filtering</h3>

<pre><code class="language-js">nock('http://foo.com')
  .filteringPath(/[&amp;\?]token=[^&amp;]*/g, '')
  .get('/user')

// catches "/user?token=..." as well
</code></pre>
