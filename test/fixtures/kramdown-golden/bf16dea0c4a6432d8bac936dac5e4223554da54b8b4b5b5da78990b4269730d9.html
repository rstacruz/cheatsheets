<h3 id="assertions">Assertions</h3>

<pre><code class="language-js">assert(val)
assert.equal(actual, expected)
assert.notEqual(a, e)
</code></pre>

<pre><code class="language-js">assert.deepEqual(a, e)
assert.notDeepEqual(a, e)
</code></pre>

<pre><code class="language-js">assert.throws(fn)
</code></pre>
