<h3 id="named-pipes">Named pipes</h3>

<pre><code class="language-sh">diff &lt;(ls ./old) &lt;(ls ./new)
</code></pre>

<p>This creates a virtual file with the contents of the output of <code>ls ./old</code>.</p>
