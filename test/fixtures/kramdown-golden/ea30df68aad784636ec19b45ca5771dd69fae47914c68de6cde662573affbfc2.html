<h3 id="bookmarking">Bookmarking</h3>

<pre><code class="language-bash">$ ncftp
$ open -u username ftp.host.com
$ bookmark bookmarkname
</code></pre>

<h3 id="mass-download">Mass download</h3>

<pre><code class="language-bash">$ ncftpget -R bookmarkname /www/ .
</code></pre>

<h3 id="mass-upload">Mass upload</h3>

<pre><code class="language-bash">$ ncftpput -R bookmarkname /www/ .
</code></pre>

<h3 id="upload-just-the-changed-files">Upload just the changed files</h3>

<pre><code class="language-bash">$ git show --pretty="format:" --name-only HEAD~1
$ ncftpget -R -C log bookmarkname /www/ .
</code></pre>
