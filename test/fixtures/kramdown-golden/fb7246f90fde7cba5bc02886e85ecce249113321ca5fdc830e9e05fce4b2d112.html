<h3 id="start-a-server">Start a server</h3>

<pre><code class="language-sh">browser-sync start --server &lt;path&gt; --files='**/*.html, **/*.css'
</code></pre>

<h3 id="options">Options</h3>

<pre><code class="language-sh">  --port=N
  --proxy="http://127.0.0.1:3000"
</code></pre>
